[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autosound-tcc"
version = "0.0.2"
description = "Read-only Tuning Command Center for car-audio DSP tuning (macOS + Windows)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ayukhno" }]
dependencies = [
    "PySide6>=6.6",
    # Declared now because the very next milestone (curve plotting) needs it;
    # pulls numpy transitively. No app code imports it yet.
    "pyqtgraph>=0.13",
    # DSP-profile onboarding agent (docs/TCC-TZ.md §4a, option B). Talks to the
    # locally-authenticated `claude` CLI session — no separate API key needed
    # in dev.
    "claude-agent-sdk>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
autosound-tcc = "autosound_tcc.app:main"
dsp-profile-interview = "autosound_tcc.dsp_profile_interview:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autosound_tcc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
