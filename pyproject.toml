[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autosound-tcc"
version = "0.1.19"
description = "Read-only Tuning Command Center for car-audio DSP tuning (macOS + Windows)."
readme = "README.md"
# 3.11, not 3.10. The old floor was a promise nobody kept: there is no CI, nothing has ever run
# on 3.10, and `uv` installs the interpreter itself — so the floor costs a user nothing and an
# untested claim costs them an evening. Raised deliberately (2026-08-12).
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ayukhno" }]
# The BASE install is the CLI half, and it is deliberately small: `tuning-session`,
# `dsp-profile-interview` and the MCP server import no Qt at all (asserted by
# `tests/test_packaging.py`, because that is an easy thing to break by adding one import). The
# window is an extra because PySide6 + pyqtgraph is hundreds of megabytes, and making the light
# path carry them defeats the point of having one (decision 2026-08-12, ARCHITECTURE-NOTES §3).
# EVERY dependency carries an upper bound, and `tests/test_packaging.py` fails if one does not.
# Open-ended `>=` means "whatever exists on the day someone installs this" — which for a tool used
# in a car at a competition is not a version policy, it is a wish. The bounds below are all
# "the next major/minor that may break us", and moving one is a deliberate act with a test run
# behind it, not something a resolver decides at 2 a.m. in a car park (user asked, 2026-08-12:
# "як наш пакет буде себе вести з часом з оновленнями версій?").
# Base = what TCC needs whatever model drives it. Every model BACKEND is an extra, because which
# one you use is a choice:
# Claude goes through the Agent SDK (a Python package), everything else — Gemini, Codex — goes
# through the `omp` CLI and needs no Python dependency at all. Carrying the Claude SDK
# unconditionally made a Gemini user download 277 MB of Claude Code they would never run, and
# made the window refuse to open without it (user asked, 2026-08-12: "а якщо хтось буде ставити
# не Клаудом, а Джеміні чи Кодексом?").
dependencies = [
    # The MCP server is the substrate BOTH front-ends talk through — the Claude session and the
    # omp one — so it belongs in the base, not behind any model's extra. Declared here because we
    # `import mcp` and `import uvicorn` directly: both used to arrive transitively through
    # `claude-agent-sdk`, which meant a dependency we call into by name was not written down
    # anywhere and vanished the moment the SDK became optional (2026-08-12).
    "mcp>=1.2,<2",
    "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
claude = [
    # DSP-profile onboarding and the tuning session, when the model is Claude (docs/TCC-TZ.md
    # §4a, option B). Runs the user's own `claude` login rather than an API key. Pre-1.0, so the
    # whole 0.x line is the risk surface; bounded at 1.0, where the vendor's own compatibility
    # promise starts.
    "claude-agent-sdk>=0.2,<1",
]
gui = [
    # -Essentials, not the full PySide6. TCC imports QtCore, QtGui and QtWidgets and nothing else
    # (`tests/test_packaging.py` checks that too); the Addons half is Qt3D, Charts, WebEngine,
    # Multimedia — 800 MB this app never touches. Strictly more permissive than requiring
    # `PySide6`, because the full package *depends on* this one: anybody who already has PySide6
    # installed already satisfies it. Measured 2026-08-12: 691 MB vs 1517 MB.
    "PySide6-Essentials>=6.6,<7",
    # Curve plotting: `ui/tcc/curve_view.py`, the panel a disagreement about a number gets
    # pointed at. Pulls numpy transitively. The tightest bound here on purpose — this is the one
    # dependency whose INTERNALS we touch: `LogHzAxis` subclasses `pg.AxisItem`, and
    # `_adopt_orphan_menus` reaches for `PlotItem.ctrlMenu`. Both are guarded, neither is public
    # API, and a minor bump deserves a look rather than a silent resolve.
    "pyqtgraph>=0.13,<0.14",
    # Written down because `core/curve_sum.py`, `ui/tcc/curve_view.py` and `ui/tcc/curve_dialog.py`
    # `import numpy` BY NAME. It arrived transitively through pyqtgraph and was declared nowhere,
    # which is the same hole `mcp` and `uvicorn` were in before they became optional-extra
    # casualties: a dependency we call into by name vanishes the day the package that happened to
    # carry it drops it. In `gui` rather than the base, because the light half must stay light —
    # `tests/test_packaging.py` blocks numpy along with Qt when it proves that, and that blocker is
    # what stops the sum engine being wired into the MCP server by accident.
    "numpy>=1.24,<3",
]
# `dev` carries `gui` on purpose: the suite is mostly Qt, run offscreen. Bounded like the rest —
# the test that enforces that caught this line first, which is the argument for having it.
# `<9` was written when 8 was current and was never revisited; the suite has since been run green
# on 8.4.2 and on 9.1.1, so the bound says what has actually been exercised rather than what was
# newest once. `packaging` is here because a test calls it BY NAME (the bounds-vs-installed check)
# — it arrives with pytest anyway, and a dependency we import and do not declare is exactly the
# hole this file exists to close.
# `scipy` because the vendored skill's dsp_math self-test designs crossovers since v3.0.12 and
# imports it BY NAME; the suite runs those self-tests, so the dependency is written down here.
dev = ["pytest>=7,<10", "packaging>=24,<27", "scipy>=1.11,<2", "autosound-tcc[gui,claude]"]

[project.scripts]
autosound-tcc = "autosound_tcc.app:main"
dsp-profile-interview = "autosound_tcc.dsp_profile_interview:main"
tuning-session = "autosound_tcc.tuning_session_cli:main"

# The same window, as a WINDOWED launcher. On Windows a console-script .exe opens a black console
# behind the Qt window and keeps it there for the app's lifetime; a `gui-scripts` entry point is
# built without a console, and that is what the installer's Desktop / Start Menu shortcuts point
# at. On macOS and Linux the two are the same thing. The console one stays for the terminal, where
# `--project-dir .` and the log line at exit are worth having.
[project.gui-scripts]
autosound-tcc-gui = "autosound_tcc.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autosound_tcc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
