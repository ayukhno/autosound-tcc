[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autosound-tcc"
version = "0.0.1"
description = "Read-only Tuning Command Center for car-audio DSP tuning (macOS + Windows)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ayukhno" }]
dependencies = [
    "PySide6>=6.6",
    # Declared now because the very next milestone (curve plotting) needs it;
    # pulls numpy transitively. No app code imports it yet.
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
autosound-tcc = "autosound_tcc.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autosound_tcc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
