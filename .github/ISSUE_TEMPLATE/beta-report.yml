name: Beta report — something broke
description: A crash, a wrong number, a window that will not open, a step that did not work.
title: "[beta] "
labels: ["beta"]
body:
  - type: markdown
    attributes:
      value: |
        **The app fills in most of this for you.** Open the repair window (the orange ⚙ in the
        header), go to **Installation** and press **Report a problem** — it opens this form with
        the installation block already in it. The **Log** tab beside it has its own Copy button.

        **A picture is welcome.** Drag a screenshot straight into any box below — for anything
        about a window (something drawn over something else, a value you cannot read, a layout
        that broke) it is the whole report.

        **This form is for the APP** — its windows, installing, updating, the AI session inside
        it. Something about the tuning METHOD itself — a wrong crossover, a target curve, what a
        step asks for — belongs in `ayukhno/autosound-tuning-skill`.

        Nothing here should carry personal data: no names, plates, addresses, or photos. Versions,
        paths and log lines are what this is for — and note that a path contains your computer's
        user name (`/Users/<you>/…`). This is a public repository; edit those out if you mind.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what happened instead of what you expected.
      placeholder: |
        I pressed "Update TCC", the terminal opened and ended with "Access is denied",
        and the app would not start afterwards.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (drag it in)
      description: >-
        Drop the image into this box — GitHub uploads it and leaves a link behind. For a fault in
        a window this is worth more than any description of it.
    validations:
      required: false
  - type: textarea
    id: install
    attributes:
      label: Installation block
      description: Diagnostics → Installation → Copy. This is what makes a report answerable.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: Diagnostics → Log → Copy. The end of the file is where the answer usually is.
      render: text
    validations:
      required: false
  - type: dropdown
    id: where
    attributes:
      label: Where it happened
      options:
        - The window (TCC)
        - Installing or updating
        - The AI session
        - REW / measurements
        - Somewhere else / not sure
    validations:
      required: false
