# What this buys, and what it deliberately does not.
#
# The suite already runs on every release: `scripts/ship.py` runs `pytest tests/ -q` whole before
# it will cut a tag. So CI is not here to run the tests -- it is here to run them where this
# machine cannot look: Windows, whose installer half is checked by hand on the author's VM, and
# Linux offscreen, where the suite aborts with exit 134 in roughly one run out of two and which
# macOS does not reproduce at all (checked three times, 2026-09-06).
#
# A release gate since HUB-057. The hub's `release-preflight.py`, which `scripts/ship.py` calls,
# refuses a tag unless CI on HEAD is green: red, still running, or no run on the sha all refuse.
# So every push to `main` runs, prose included -- the commit a release starts from is a CHANGELOG
# commit by construction, and a path filter would leave it with no run to read (HUB-058, hub #136).
# A branch runs through its pull request only: a push trigger on every branch ran each PR commit
# twice, `push` and `pull_request`, with nothing new in the second run.
#
# Two shapes of run, and which one a person waits for decides everything (TCC-020, hub #181).
#
# THE PULL REQUEST is sharded: `tests/` split four ways per platform by `scripts/ci_shard.py`, each
# shard a separate machine running its quarter SERIALLY. Measured 2026-09-18: the wait was the
# suite and the suite is uniform volume — Windows ran 2104 tests in 1273 s and its forty slowest
# were 290 s of that, so deleting every one of them would have moved 21.2 minutes to 16.4. A
# quarter each is about 6. This is not the `-n auto` that was rejected on 2026-09-09: that put
# eight workers on one machine and killed Qt in 29% of runs; here each job has a whole runner and
# the same serial conditions a release has, with fewer tests per process.
#
# THE PUSH TO `main` runs the suite WHOLE and serial, on the commit the wave was merged onto. It is
# the run the release gate reads, and it is the one that can still catch what fewer tests per
# process can hide — the Linux abort (HUB-049) and the `#19` class of native Windows crash, both of
# which need a long run in one process to show. Nobody waits for it interactively.
#
# So each commit still runs once in each shape, and neither is a substitute for the other. The
# earlier arrangement — a full run on the pull request, skipped on `main` when a green PR run
# existed on the same sha — is gone with the `pr-green` job that asked the question.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  # The Linux abort (HUB-049) shows in about half of runs, and a push gives exactly one. A series
  # on demand is what turns "no repro" into evidence: run this with `linux_runs: 20` and read the
  # matrix. Without it, "N runs with no exit 134" would be collected by accident, over weeks.
  workflow_dispatch:
    inputs:
      linux_runs:
        description: "How many times to run the Linux suite (HUB-049 needs a series, not one run)"
        default: "1"
        required: false
      # Same instrument, other platform. The Windows crash of #19 showed in roughly one full run in
      # three until it was fixed (2026-09-12): one job neither confirms a fault like that nor clears
      # it, and a fix for it cannot be judged by one green run either.
      windows_runs:
        description: "How many times to run the Windows suite (a 1-in-3 fault needs a series)"
        default: "1"
        required: false
      # Narrow the series to part of the suite, e.g. `tests/test_dialog_live.py
      # tests/test_diagnostics_panel.py` — nine minutes becomes one, once it is known that the
      # narrow set still reproduces. Empty means the whole suite.
      pytest_args:
        description: "What to run in the series (default: the whole suite)"
        default: ""
        required: false
      # Below the Python frame. A native crash's Python dump stops wherever Python happened to be —
      # for #19 that was `QThread.__init__`, and the fault was elsewhere — so the question is native:
      # run the Windows series under cdb and print the native stacks when the process dies
      # (`scripts/ci_native_debug.sh`). This is what found #19. The retry below is bypassed.
      native_debug:
        description: "Windows series under cdb: native stacks on a crash"
        default: "false"
        required: false
      page_heap:
        description: "With native_debug: full page heap, to catch a corruption where it is made"
        default: "false"
        required: false
      stale_check:
        description: "With native_debug: walk the wrapper map after every test (PYTHONMALLOC=debug)"
        default: "false"
        required: false

concurrency:
  # A manual series gets its own group: it is the answer to a question somebody asked, and a push
  # landing mid-series must neither kill it nor be killed by it.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

# `contents: read` for the checkouts, and nothing else: no job here asks GitHub about GitHub any
# more (the run-listing that needed `actions: read` went with `pr-green`).
permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No submodule: the linter reads `src tests scripts`, and `vendor/` is not ours to lint.
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Pinned, and pinned on purpose: ruff's default rule set is a property of its VERSION, so an
      # unpinned run would add rule classes to this repo silently. `[tool.ruff.lint]` in
      # pyproject.toml names the classes; this names the ruff that reads them (HUB-047).
      - run: uvx ruff@0.12.0 check src tests scripts --statistics

  # The short loop. `tests/cross-platform-suspects.txt` lists exactly what the first CI runs
  # found failing off macOS; running only those takes about a minute where the full suite takes
  # nine, so a fix can be checked while it is still in the author's head. Delete a line from the
  # file when it is fixed — an empty list is the goal, and this job going green is what says so.
  #
  # It does NOT replace the full jobs below: this list says where to look, never that the rest is
  # fine. Red here is not a blinking check — it is a count of work left, and it points at a file.
  suspects:
    name: suspects (${{ matrix.os }})
    # The pull request's, like the shards: on `main` the whole suite runs anyway, and this list is
    # a minute of it.
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # `shell: bash` on both: the Windows runner has it, and one command beats maintaining a
      # PowerShell twin of the same line.
      - shell: bash
        run: |
          mapfile -t ids < <(grep -vE '^[[:space:]]*(#|$)' tests/cross-platform-suspects.txt)
          if [ ${#ids[@]} -eq 0 ]; then
            echo "the list is empty — nothing left to suspect"
            exit 0
          fi
          printf 'running %s entries\n' "${#ids[@]}"
          uv run --extra dev --python 3.12 python -m pytest "${ids[@]}" -q

  # The pull request's whole answer, four ways per platform. macOS is in here rather than on its
  # own any more: as the control it earns nothing on a push (it is the machine the author already
  # runs), and on a pull request it says whether a failure elsewhere is platform-specific or simply
  # a broken commit — which a quarter of it says just as well, four times sooner.
  #
  # The split is `scripts/ci_shard.py`: by FILE, because a session-scoped QApplication and
  # module-level state make a file the safe unit (`docs/TESTING.md`, under `--dist loadfile`), and
  # weighted by a recorded serial run rather than alphabetically, because two files are a fifth of
  # the suite. Each job works the same split out independently and they never talk: the test that
  # every file is claimed exactly once is `tests/test_ci_shard.py`, not this file.
  shard:
    name: shard ${{ matrix.group }}/4 (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # The Linux abort (HUB-049) is not this commit's fault, and a check that blinks is ignored
    # within a week — the same reason the full `linux` job below carries this flag. Windows and
    # macOS go red for real.
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - shell: bash
        env:
          # Through `env` rather than interpolated into the line, like every other input here.
          GROUP: ${{ matrix.group }}
        run: |
          # `--no-project`: the splitter is stdlib only, and syncing the project twice to ask it
          # one question would spend the minutes this job exists to save.
          files=$(uv run --no-project --python 3.12 python scripts/ci_shard.py --splits 4 --group "$GROUP")
          count=$(printf '%s\n' $files | grep -c .)
          echo "shard $GROUP of 4 on ${{ matrix.os }}: $count files"
          echo "shard **$GROUP/4** on \`${{ matrix.os }}\`: $count test files" >> "$GITHUB_STEP_SUMMARY"
          uv run --extra dev --python 3.12 python -m pytest $files -q

  # How many Linux runs this workflow was asked for, as a matrix. One on a push; whatever the
  # dispatch input says when a person is chasing the abort.
  linux-plan:
    name: linux plan
    # The whole-suite half: a push to `main`, or a series somebody asked for by hand. The pull
    # request has the shards instead.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs: ${{ steps.count.outputs.runs }}
    steps:
      - id: count
        # Through `env`, not interpolated into the script: an input is text a person typed, and
        # text typed into a shell line is a shell line.
        env:
          LINUX_RUNS: ${{ github.event.inputs.linux_runs }}
        run: |
          n="$LINUX_RUNS"
          # Anything but a plain number is a typo, and a typo must not be a failed workflow.
          [[ "$n" =~ ^[0-9]+$ ]] || n=1
          (( n >= 1 )) || n=1
          (( n <= 50 )) || n=50
          echo "runs=$(seq 1 "$n" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  linux:
    name: linux (run ${{ matrix.run }})
    needs: linux-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Red here does not mean the build is broken -- it means the abort happened again. A check
    # that blinks is ignored within a week, and an ignored CI is worse than none, so this one
    # reports instead of blocking. The flag comes off when HUB-049 is closed.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.linux-plan.outputs.runs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Without it `vendor/autosound-tuning-skill` is empty, the REW client does not import,
          # and the suite does not collect at all.
          submodules: true
      # Qt links against these even for the offscreen platform, and the GitHub image does not
      # ship them: without this the suite does not COLLECT (`ImportError: libEGL.so.1`, run
      # 34135331995), so the job would report a red that has nothing to do with the abort it is
      # here to catch. macOS and Windows carry their own.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # `-v`, not the `-q` the other two use. SIGABRT kills the process where it stands: with `-q`
      # the log ends on a row of dots and the culprit is unnamed, and naming it is the entire
      # reason Linux is in this file. PYTHONFAULTHANDLER prints the C-level stack with it.
      #
      # QT_QPA_PLATFORM is not set here -- `tests/conftest.py` already does it for every platform.
      - run: uv run --extra dev --python 3.12 python -m pytest tests/ -v
        env:
          PYTHONFAULTHANDLER: "1"

  # How many Windows runs were asked for. One on a push; a series when somebody is chasing a crash.
  windows-plan:
    name: windows plan
    # The whole-suite half: a push to `main`, or a series somebody asked for by hand. The pull
    # request has the shards instead.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs: ${{ steps.count.outputs.runs }}
    steps:
      - id: count
        env:
          WINDOWS_RUNS: ${{ github.event.inputs.windows_runs }}
        run: |
          n="$WINDOWS_RUNS"
          [[ "$n" =~ ^[0-9]+$ ]] || n=1
          (( n >= 1 )) || n=1
          (( n <= 20 )) || n=20
          echo "runs=$(seq 1 "$n" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  windows:
    name: windows (run ${{ matrix.run }})
    needs: windows-plan
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.windows-plan.outputs.runs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Same command as `make test`, deliberately: CI running something the author cannot run by
      # hand is how a green tick stops meaning anything. `pytest_args` narrows it only when a
      # person asked for a narrower series.
      #
      # `-p no:cacheprovider`: the matrix runs share nothing, and a cache write is one more thing
      # that can differ between run 3 and run 7 of a fault we are trying to measure.
      - shell: bash
        env:
          PYTEST_ARGS: ${{ github.event.inputs.pytest_args }}
          NATIVE_DEBUG: ${{ github.event.inputs.native_debug }}
          PAGE_HEAP: ${{ github.event.inputs.page_heap }}
          STALE_CHECK: ${{ github.event.inputs.stale_check }}
        run: |
          args="${PYTEST_ARGS:-tests/}"
          echo "running: $args"
          if [ "$NATIVE_DEBUG" = "true" ]; then
            exec bash scripts/ci_native_debug.sh $args
          fi

          # Retry ONLY on a native crash, never on a test that failed. #19 killed the process with
          # `Windows fatal exception: access violation` in about 4 runs of 10 until it was fixed on
          # 2026-09-12, and a job red 40% of the time for a reason unrelated to the commit is a job
          # people stop reading — the same argument that put Linux under `continue-on-error`.
          #
          # Deliberately NOT `continue-on-error` here: that would swallow real failures too. This
          # retries one kind of fault and nothing else, and says so in the run summary every time.
          # With #19 fixed, a retry here is news: read the dump, do not wave it through.
          attempts=3
          for i in $(seq 1 $attempts); do
            set +e
            uv run --extra dev --python 3.12 python -m pytest $args -q -p no:cacheprovider \
              2>&1 | tee /tmp/pytest-out.txt
            code=${PIPESTATUS[0]}
            set -e
            if ! grep -q "Windows fatal exception" /tmp/pytest-out.txt; then
              exit $code
            fi
            echo "::warning title=native crash::attempt $i died with an access violation, not a test failure"
            echo "- a native crash ended attempt **$i** of $attempts — read the dump" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "::error title=native crash::the suite crashed $attempts times in a row"
          exit 1
