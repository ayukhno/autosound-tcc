# What this buys, and what it deliberately does not.
#
# CI runs the suite where this machine cannot look: Windows, whose installer half is checked by hand
# on the author's VM, and Linux offscreen, where the suite aborts with exit 134 in roughly one run
# out of two and which macOS does not reproduce at all (checked three times, 2026-09-06).
#
# What the release gate reads, which run counts and when a commit may rest on its parent's run are
# the hub's rules, not this file's: hub `governance/RELEASE-CHANNEL.md` §9.9-§9.9.2 and
# `governance/WAVES.md` §2, carried by `hub/scripts/release-preflight.py`. Only this workflow's
# own choices are written here: its triggers, its filter list and why each path is on it.
#
# THE FILTER. A push to `main` that changes only prose runs nothing (`paths-ignore` below, HUB-098,
# hub #339). The list names only what no test reads: README.md, docs/TESTING.md and docs/guide/*.md
# are read by tests and stay code. `scripts/ship.py` reads CHANGELOG.md and docs/TODO.md on this
# machine at tag time; CI never runs it, so a run on those files checks nothing. Plain `*` and `**`
# only: the hub's gate reads this list and refuses a prose tip when it meets another glob. A path
# left off the list only costs a run; a path wrongly on it skips one, so add one only after a grep
# of tests/. The pull request is not filtered: it runs whole once, whatever it touches.
#
# ONE SHAPE (hub #339 ask 2). The pull request is sharded: `tests/` split four ways per platform by
# `scripts/ci_shard.py`, each shard a separate machine running its quarter SERIALLY (TCC-020, hub
# #181; measured 2026-09-18: about 6 minutes a quarter where the whole Windows suite took 21). This
# is not the `-n auto` rejected on 2026-09-09: each job has a whole runner and the conditions a
# release has, with fewer tests per process. Inside a shard each FILE is its own pytest process
# (`scripts/ci_per_file.py`, #275 option A1), so no file pays for the windows and state the files
# before it left (`docs/CI-ROOT-CAUSE-2026-11-10.md` RC1, RC3).
#
# THE METHOD JOB (#275 option G). The tests of other systems -- the method's own self-tests, its
# installers check, the bare-CLI writer race, the real `uv` export: pytest's `method` marker -- run
# in one job of their own, and only when the change touches `vendor/`, `scripts/` or a dependency file (`uv.lock`,
# `pyproject.toml`, `constraints.txt`; `gate` works that out from the compare API). The shards leave them out. No schedule.
#
# The push to `main` runs the same shards, and only when no green pull-request run of this workflow
# exists on that commit (`gate` below, as the skill's `checks.yml` does it). After `--ff-only` the
# PR's run is on the very commit, so `main` runs the linter and nothing else; a commit that reached
# `main` without a PR is tested there in full.
#
# The whole suite in one process per platform (`linux`, `windows`) runs on demand only, as a series
# (`workflow_dispatch`). It was `main`'s run until 2026-11-21: its reasons were closed (`#19` fixed
# 09-12, HUB-049 closed 09-14), and since 10-02 it found no product defect and made seven test-only
# reds, one process of 150 files accumulating widgets and state (`docs/CI-ROOT-CAUSE-2026-11-10.md`
# RC4). A series is still how a long-process fault is chased.
#
# A branch runs through its pull request only: a push trigger on every branch ran each PR commit
# twice, `push` and `pull_request`, with nothing new in the second run.
name: checks

on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
      - CLAUDE.md
      - NOTICE.md
      - docs/TODO.md
      - docs/*-*.md
      - docs/audit/**
      - docs/superpowers/**
      - docs/guide/img/**
      - spike/**.md
  pull_request:
  # The Linux abort (HUB-049) shows in about half of runs, and a push gives exactly one. A series
  # on demand is what turns "no repro" into evidence: run this with `linux_runs: 20` and read the
  # matrix. Without it, "N runs with no exit 134" would be collected by accident, over weeks.
  workflow_dispatch:
    inputs:
      linux_runs:
        description: "How many times to run the Linux suite (HUB-049 needs a series, not one run)"
        default: "1"
        required: false
      # Same instrument, other platform. The Windows crash of #19 showed in roughly one full run in
      # three until it was fixed (2026-09-12): one job neither confirms a fault like that nor clears
      # it, and a fix for it cannot be judged by one green run either.
      windows_runs:
        description: "How many times to run the Windows suite (a 1-in-3 fault needs a series)"
        default: "1"
        required: false
      # Narrow the series to part of the suite, e.g. `tests/test_dialog_live.py
      # tests/test_diagnostics_panel.py` — nine minutes becomes one, once it is known that the
      # narrow set still reproduces. Empty means the whole suite.
      pytest_args:
        description: "What to run in the series (default: the whole suite)"
        default: ""
        required: false
      # Below the Python frame. A native crash's Python dump stops wherever Python happened to be —
      # for #19 that was `QThread.__init__`, and the fault was elsewhere — so the question is native:
      # run the Windows series under cdb and print the native stacks when the process dies
      # (`scripts/ci_native_debug.sh`). This is what found #19. The retry below is bypassed.
      native_debug:
        description: "Windows series under cdb: native stacks on a crash"
        default: "false"
        required: false
      page_heap:
        description: "With native_debug: full page heap, to catch a corruption where it is made"
        default: "false"
        required: false
      stale_check:
        description: "With native_debug: walk the wrapper map after every test (PYTHONMALLOC=debug)"
        default: "false"
        required: false

concurrency:
  # A manual series gets its own group: it is the answer to a question somebody asked, and a push
  # landing mid-series must neither kill it nor be killed by it.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  # A newer push replaces a branch's run; on `main` a run always finishes, and GitHub keeps at most
  # one pending behind it. A second push used to kill `main`'s verdict: 77 of 120 (hub #339).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# `contents: read` for the checkouts; `actions: read` for `gate`, which lists this workflow's own
# runs. Nothing here writes.
permissions:
  contents: read
  actions: read

jobs:
  # Whether the suite runs at all. A pull request: yes. A push to `main`: only when no green
  # pull-request run of this workflow exists on the same commit. Anything it cannot establish -- no
  # answer from the API, an unexpected shape -- counts as "not found", so the suite runs: a skip
  # needs a green run to point at. A manual series: no, the whole-suite jobs below are its answer.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.pr.outputs.run }}
      method: ${{ steps.method.outputs.method }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            push) ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          found="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=pull_request&status=success" --jq '.total_count' 2>/dev/null || echo 0)"
          if [ "${found:-0}" -gt 0 ] 2>/dev/null; then
            echo "a green pull-request run of checks exists on $SHA -- the suite is not run twice"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "no green pull-request run on $SHA -- running the shards on main"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      # Whether the `method` job runs: only where the suite runs at all, and only when the change
      # touches `vendor/` (the pin is a gitlink there), `scripts/`, or a dependency file the real
      # `uv export` test reads (`uv.lock`, `pyproject.toml`, `constraints.txt`). A pull request is compared
      # from its base, a push from the commit before it. Fail open, as above: no base, no answer,
      # or a list GitHub may have cut short (300 files) runs the job.
      - id: method
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ steps.pr.outputs.run }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$RUN" != "true" ]; then
            echo "method=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE" ] || [ -z "${BASE//0/}" ]; then
            echo "no commit to compare with -- the method job runs"
            echo "method=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed="$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq '.files[].filename' 2>/dev/null)" \
              || [ -z "$changed" ] || [ "$(printf '%s\n' "$changed" | grep -c .)" -ge 300 ]; then
            echo "the changed files are not known -- the method job runs"
            echo "method=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -qE '^(vendor/|scripts/|uv\.lock$|pyproject\.toml$|constraints\.txt$)'; then
            echo "vendor/, scripts/ or the dependencies changed -- the method job runs"
            echo "method=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing under vendor/ or scripts/ and no dependency file changed -- no method job"
            echo "method=false" >> "$GITHUB_OUTPUT"
          fi

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No submodule: the linter reads `src tests scripts`, and `vendor/` is not ours to lint.
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Pinned, and pinned on purpose: ruff's default rule set is a property of its VERSION, so an
      # unpinned run would add rule classes to this repo silently. `[tool.ruff.lint]` in
      # pyproject.toml names the classes; this names the ruff that reads them (HUB-047).
      - run: uvx ruff@0.12.0 check src tests scripts --statistics

  # The short loop. `tests/cross-platform-suspects.txt` lists exactly what the first CI runs
  # found failing off macOS; running only those takes about a minute where the full suite takes
  # nine, so a fix can be checked while it is still in the author's head. Delete a line from the
  # file when it is fixed — an empty list is the goal, and this job going green is what says so.
  #
  # It does NOT replace the full jobs below: this list says where to look, never that the rest is
  # fine. Red here is not a blinking check — it is a count of work left, and it points at a file.
  suspects:
    name: suspects (${{ matrix.os }})
    # With the shards, wherever they run: this list is a minute of them.
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # `shell: bash` on both: the Windows runner has it, and one command beats maintaining a
      # PowerShell twin of the same line.
      - shell: bash
        run: |
          mapfile -t ids < <(grep -vE '^[[:space:]]*(#|$)' tests/cross-platform-suspects.txt)
          if [ ${#ids[@]} -eq 0 ]; then
            echo "the list is empty — nothing left to suspect"
            exit 0
          fi
          printf 'running %s entries\n' "${#ids[@]}"
          uv run --locked --extra dev --python 3.12 python -m pytest "${ids[@]}" -q

  # The pull request's whole answer, four ways per platform, and `main`'s when no green PR run
  # exists on the commit. macOS is in here rather than on its own: it says whether a failure
  # elsewhere is platform-specific or simply a broken commit — which a quarter of it says just as
  # well, four times sooner.
  #
  # The split is `scripts/ci_shard.py`: by FILE, because a session-scoped QApplication and
  # module-level state make a file the safe unit (`docs/TESTING.md`, under `--dist loadfile`), and
  # weighted by a recorded run of each file in its own process rather than alphabetically, because
  # two files are a fifth of the suite. Each job works the same split out independently and they
  # never talk: the test that every file is claimed exactly once is `tests/test_ci_shard.py`, not
  # this file. Each file then runs in its own process (`scripts/ci_per_file.py`), the condition its
  # weight was recorded in, and the job is red when any file is; the log's end names each one.
  shard:
    name: shard ${{ matrix.group }}/4 (${{ matrix.os }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # No `continue-on-error` on any platform (#275, option H). Linux carried one for the abort of
    # HUB-049, closed 2026-09-14 with no recurrence, and the run read green while the Linux suite
    # was red for three weeks (`docs/CI-ROOT-CAUSE-2026-11-10.md` RC4).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - shell: bash
        env:
          # Through `env` rather than interpolated into the line, like every other input here.
          GROUP: ${{ matrix.group }}
        run: |
          # `--no-project`: the splitter is stdlib only, and syncing the project twice to ask it
          # one question would spend the minutes this job exists to save. So no `--locked` here
          # either: with no project there is no lock to hold the run to.
          files=$(uv run --no-project --python 3.12 python scripts/ci_shard.py --splits 4 --group "$GROUP")
          count=$(printf '%s\n' $files | grep -c .)
          echo "shard $GROUP of 4 on ${{ matrix.os }}: $count files"
          echo "shard **$GROUP/4** on \`${{ matrix.os }}\`: $count test files" >> "$GITHUB_STEP_SUMMARY"
          # One process per file; `-m "not method"` leaves the `method` job's tests to that job.
          # 120 s per test function, fixtures not counted, so a hang names its test (#275, D):
          # here only, where each file has a process of its own (`pyproject.toml` says why).
          uv run --locked --extra dev --python 3.12 python scripts/ci_per_file.py $files -- -q -m "not method" --timeout=120 -o timeout_func_only=true

  # The tests of other systems, once per platform, only when `vendor/`, `scripts/` or a
  # dependency file changed (`gate`): the method's self-tests and installers check, the bare-CLI writer race, the real `uv`
  # export -- pytest's `method` marker (`pyproject.toml`). They were about a quarter of every
  # shard's time (`docs/CI-ROOT-CAUSE-2026-11-10.md` RC5). One process: they are subprocess-bound
  # and build no windows, so there is nothing for them to accumulate.
  method:
    name: method (${{ matrix.os }})
    needs: gate
    if: needs.gate.outputs.method == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - shell: bash
        run: uv run --locked --extra dev --python 3.12 python -m pytest tests/ -m method -q

  # How many Linux runs this workflow was asked for, as a matrix: whatever the dispatch input says
  # when a person is chasing the abort.
  linux-plan:
    name: linux plan
    # The whole-suite half: a series somebody asked for by hand, nothing else. A pull request and a
    # push to `main` have the shards.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs: ${{ steps.count.outputs.runs }}
    steps:
      - id: count
        # Through `env`, not interpolated into the script: an input is text a person typed, and
        # text typed into a shell line is a shell line.
        env:
          LINUX_RUNS: ${{ github.event.inputs.linux_runs }}
        run: |
          n="$LINUX_RUNS"
          # Anything but a plain number is a typo, and a typo must not be a failed workflow.
          [[ "$n" =~ ^[0-9]+$ ]] || n=1
          (( n >= 1 )) || n=1
          (( n <= 50 )) || n=50
          echo "runs=$(seq 1 "$n" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  linux:
    name: linux (run ${{ matrix.run }})
    needs: linux-plan
    runs-on: ubuntu-latest
    # 45, not 30: the whole suite in one Linux job took 26m39s at v0.1.44 and was cancelled at 30m at v0.1.45
    # (the wave W-4 added ~70 UI tests) — slow, not hung (2026-09-30, the Arbiter's word).
    timeout-minutes: 45
    # No `continue-on-error` (#275, option H): HUB-049 is closed, and a series whose red reads green
    # answers nothing.
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.linux-plan.outputs.runs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Without it `vendor/autosound-tuning-skill` is empty, the REW client does not import,
          # and the suite does not collect at all.
          submodules: true
      # Qt links against these even for the offscreen platform, and the GitHub image does not
      # ship them: without this the suite does not COLLECT (`ImportError: libEGL.so.1`, run
      # 34135331995), so the job would report a red that has nothing to do with the abort it is
      # here to catch. macOS and Windows carry their own.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # `-v`, not the `-q` the other two use. SIGABRT kills the process where it stands: with `-q`
      # the log ends on a row of dots and the culprit is unnamed, and naming it is the entire
      # reason Linux is in this file. PYTHONFAULTHANDLER prints the C-level stack with it.
      #
      # QT_QPA_PLATFORM is not set here -- `tests/conftest.py` already does it for every platform.
      - run: uv run --locked --extra dev --python 3.12 python -m pytest tests/ -v
        env:
          PYTHONFAULTHANDLER: "1"

  # How many Windows runs were asked for: a series when somebody is chasing a crash.
  windows-plan:
    name: windows plan
    # The whole-suite half: a series somebody asked for by hand, nothing else. A pull request and a
    # push to `main` have the shards.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs: ${{ steps.count.outputs.runs }}
    steps:
      - id: count
        env:
          WINDOWS_RUNS: ${{ github.event.inputs.windows_runs }}
        run: |
          n="$WINDOWS_RUNS"
          [[ "$n" =~ ^[0-9]+$ ]] || n=1
          (( n >= 1 )) || n=1
          (( n <= 20 )) || n=20
          echo "runs=$(seq 1 "$n" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  windows:
    name: windows (run ${{ matrix.run }})
    needs: windows-plan
    runs-on: windows-latest
    # 45, not 30: the whole suite in one Windows job took 27m48s at v0.1.43 and was cancelled at 85%
    # at v0.1.44 — slow, not hung; the PR's four shards took 4-6 minutes each (the wave's release,
    # 2026-09-27). 60 from v0.1.45: 41m03s at v0.1.44 left no room for the wave W-4's ~70 UI tests
    # (2026-09-30, the Arbiter's word).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.windows-plan.outputs.runs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Same command as `make test`, deliberately: CI running something the author cannot run by
      # hand is how a green tick stops meaning anything. `pytest_args` narrows it only when a
      # person asked for a narrower series.
      #
      # `-p no:cacheprovider`: the matrix runs share nothing, and a cache write is one more thing
      # that can differ between run 3 and run 7 of a fault we are trying to measure.
      - shell: bash
        env:
          PYTEST_ARGS: ${{ github.event.inputs.pytest_args }}
          NATIVE_DEBUG: ${{ github.event.inputs.native_debug }}
          PAGE_HEAP: ${{ github.event.inputs.page_heap }}
          STALE_CHECK: ${{ github.event.inputs.stale_check }}
        run: |
          args="${PYTEST_ARGS:-tests/}"
          echo "running: $args"
          if [ "$NATIVE_DEBUG" = "true" ]; then
            exec bash scripts/ci_native_debug.sh $args
          fi

          # Retry ONLY on a native crash, never on a test that failed. #19 killed the process with
          # `Windows fatal exception: access violation` in about 4 runs of 10 until it was fixed on
          # 2026-09-12, and a job red 40% of the time for a reason unrelated to the commit is a job
          # people stop reading — the same argument that once put Linux under `continue-on-error`.
          #
          # Deliberately NOT `continue-on-error` here: that would swallow real failures too. This
          # retries one kind of fault and nothing else, and says so in the run summary every time.
          # With #19 fixed, a retry here is news: read the dump, do not wave it through.
          attempts=3
          for i in $(seq 1 $attempts); do
            set +e
            uv run --locked --extra dev --python 3.12 python -m pytest $args -q -p no:cacheprovider \
              2>&1 | tee /tmp/pytest-out.txt
            code=${PIPESTATUS[0]}
            set -e
            if ! grep -q "Windows fatal exception" /tmp/pytest-out.txt; then
              exit $code
            fi
            echo "::warning title=native crash::attempt $i died with an access violation, not a test failure"
            echo "- a native crash ended attempt **$i** of $attempts — read the dump" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "::error title=native crash::the suite crashed $attempts times in a row"
          exit 1
