# What this buys, and what it deliberately does not.
#
# The suite already runs on every release: `scripts/ship.py` runs `pytest tests/ -q` whole before
# it will cut a tag. So CI is not here to run the tests -- it is here to run them where this
# machine cannot look: Windows, whose installer half is checked by hand on the author's VM, and
# Linux offscreen, where the suite aborts with exit 134 in roughly one run out of two and which
# macOS does not reproduce at all (checked three times, 2026-09-06).
#
# NOT a release gate. `ship.py` is untouched: nothing here can hold a tag back. That is a decision
# (HUB-045), not an omission -- the 6-10 minutes are already paid locally, and a gate would add
# waiting to the release path for no new information.
#
# The path filter below is safe FOR THAT REASON. A skipped job reports nothing at all, so on a
# repo where these checks were required, a docs-only pull request would sit forever in "Expected"
# with no way to merge. Whoever makes this a gate has to drop `paths-ignore` in the same change.
name: checks

on:
  push:
    # Prose does not warm three runners. Narrow on purpose: `pyproject.toml`, `uv.lock` and
    # `.github/**` are NOT ignored, so a dependency bump or an edit to this file still runs.
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
  # The Linux abort (HUB-049) shows in about half of runs, and a push gives exactly one. A series
  # on demand is what turns "no repro" into evidence: run this with `linux_runs: 20` and read the
  # matrix. Without it, "N runs with no exit 134" would be collected by accident, over weeks.
  workflow_dispatch:
    inputs:
      linux_runs:
        description: "How many times to run the Linux suite (HUB-049 needs a series, not one run)"
        default: "1"
        required: false
      # Same instrument, other platform. The Windows crash (#19) shows in roughly one full run in
      # three, so a single job neither confirms it nor clears it — and a fix for a 1-in-3 fault
      # cannot be judged by one green run either.
      windows_runs:
        description: "How many times to run the Windows suite (#19 shows in about 1 run in 3)"
        default: "1"
        required: false
      # Narrow the series to part of the suite, e.g. `tests/test_dialog_live.py
      # tests/test_diagnostics_panel.py` — nine minutes becomes one, once it is known that the
      # narrow set still reproduces. Empty means the whole suite.
      pytest_args:
        description: "What to run in the series (default: the whole suite)"
        default: ""
        required: false
      # `#19` below the Python frame. The dump stops at `QThread.__init__` with nothing else
      # alive, so the question is native: run the Windows series under cdb and print the native
      # stacks when the process dies (`scripts/ci_native_debug.sh`). The retry below is bypassed.
      native_debug:
        description: "Windows series under cdb: native stacks on a crash (#19)"
        default: "false"
        required: false
      page_heap:
        description: "With native_debug: full page heap, to catch a corruption where it is made"
        default: "false"
        required: false

concurrency:
  # A manual series gets its own group: it is the answer to a question somebody asked, and a push
  # landing mid-series must neither kill it nor be killed by it.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No submodule: the linter reads `src tests scripts`, and `vendor/` is not ours to lint.
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Pinned, and pinned on purpose: ruff's default rule set is a property of its VERSION, so an
      # unpinned run would add rule classes to this repo silently. `[tool.ruff.lint]` in
      # pyproject.toml names the classes; this names the ruff that reads them (HUB-047).
      - run: uvx ruff@0.12.0 check src tests scripts --statistics

  # The short loop. `tests/cross-platform-suspects.txt` lists exactly what the first CI runs
  # found failing off macOS; running only those takes about a minute where the full suite takes
  # nine, so a fix can be checked while it is still in the author's head. Delete a line from the
  # file when it is fixed — an empty list is the goal, and this job going green is what says so.
  #
  # It does NOT replace the full jobs below: this list says where to look, never that the rest is
  # fine. Red here is not a blinking check — it is a count of work left, and it points at a file.
  suspects:
    name: suspects (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # `shell: bash` on both: the Windows runner has it, and one command beats maintaining a
      # PowerShell twin of the same line.
      - shell: bash
        run: |
          mapfile -t ids < <(grep -vE '^[[:space:]]*(#|$)' tests/cross-platform-suspects.txt)
          if [ ${#ids[@]} -eq 0 ]; then
            echo "the list is empty — nothing left to suspect"
            exit 0
          fi
          printf 'running %s entries\n' "${#ids[@]}"
          uv run --extra dev --python 3.12 python -m pytest "${ids[@]}" -q

  # How many Linux runs this workflow was asked for, as a matrix. One on a push; whatever the
  # dispatch input says when a person is chasing the abort.
  linux-plan:
    name: linux plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs: ${{ steps.count.outputs.runs }}
    steps:
      - id: count
        # Through `env`, not interpolated into the script: an input is text a person typed, and
        # text typed into a shell line is a shell line.
        env:
          LINUX_RUNS: ${{ github.event.inputs.linux_runs }}
        run: |
          n="$LINUX_RUNS"
          # Anything but a plain number is a typo, and a typo must not be a failed workflow.
          [[ "$n" =~ ^[0-9]+$ ]] || n=1
          (( n >= 1 )) || n=1
          (( n <= 50 )) || n=50
          echo "runs=$(seq 1 "$n" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  linux:
    name: linux (run ${{ matrix.run }})
    needs: linux-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Red here does not mean the build is broken -- it means the abort happened again. A check
    # that blinks is ignored within a week, and an ignored CI is worse than none, so this one
    # reports instead of blocking. The flag comes off when HUB-049 is closed.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.linux-plan.outputs.runs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Without it `vendor/autosound-tuning-skill` is empty, the REW client does not import,
          # and the suite does not collect at all.
          submodules: true
      # Qt links against these even for the offscreen platform, and the GitHub image does not
      # ship them: without this the suite does not COLLECT (`ImportError: libEGL.so.1`, run
      # 34135331995), so the job would report a red that has nothing to do with the abort it is
      # here to catch. macOS and Windows carry their own.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # `-v`, not the `-q` the other two use. SIGABRT kills the process where it stands: with `-q`
      # the log ends on a row of dots and the culprit is unnamed, and naming it is the entire
      # reason Linux is in this file. PYTHONFAULTHANDLER prints the C-level stack with it.
      #
      # QT_QPA_PLATFORM is not set here -- `tests/conftest.py` already does it for every platform.
      - run: uv run --extra dev --python 3.12 python -m pytest tests/ -v
        env:
          PYTHONFAULTHANDLER: "1"

  # How many Windows runs were asked for. One on a push; a series when somebody is chasing #19.
  windows-plan:
    name: windows plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs: ${{ steps.count.outputs.runs }}
    steps:
      - id: count
        env:
          WINDOWS_RUNS: ${{ github.event.inputs.windows_runs }}
        run: |
          n="$WINDOWS_RUNS"
          [[ "$n" =~ ^[0-9]+$ ]] || n=1
          (( n >= 1 )) || n=1
          (( n <= 20 )) || n=20
          echo "runs=$(seq 1 "$n" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  windows:
    name: windows (run ${{ matrix.run }})
    needs: windows-plan
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.windows-plan.outputs.runs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Same command as `make test`, deliberately: CI running something the author cannot run by
      # hand is how a green tick stops meaning anything. `pytest_args` narrows it only when a
      # person asked for a narrower series.
      #
      # `-p no:cacheprovider`: the matrix runs share nothing, and a cache write is one more thing
      # that can differ between run 3 and run 7 of a fault we are trying to measure.
      - shell: bash
        env:
          PYTEST_ARGS: ${{ github.event.inputs.pytest_args }}
          NATIVE_DEBUG: ${{ github.event.inputs.native_debug }}
          PAGE_HEAP: ${{ github.event.inputs.page_heap }}
        run: |
          args="${PYTEST_ARGS:-tests/}"
          echo "running: $args"
          if [ "$NATIVE_DEBUG" = "true" ]; then
            exec bash scripts/ci_native_debug.sh $args
          fi

          # Retry ONLY on the known crash, never on a test that failed. #19 kills the process
          # with `Windows fatal exception: access violation` in about 4 runs of 10, and a job that
          # is red 40% of the time for a reason unrelated to the commit is a job people stop
          # reading — the same argument that put Linux under `continue-on-error`.
          #
          # Deliberately NOT `continue-on-error` here: that would swallow real failures too. This
          # swallows one named fault and nothing else, and it says so in the run summary every
          # time, so the frequency stays in sight while #19 is deferred rather than fixed.
          attempts=3
          for i in $(seq 1 $attempts); do
            set +e
            uv run --extra dev --python 3.12 python -m pytest $args -q -p no:cacheprovider \
              2>&1 | tee /tmp/pytest-out.txt
            code=${PIPESTATUS[0]}
            set -e
            if ! grep -q "Windows fatal exception" /tmp/pytest-out.txt; then
              exit $code
            fi
            echo "::warning title=#19::attempt $i died with an access violation, not a test failure"
            echo "- \`#19\` crashed the suite on attempt **$i** of $attempts" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "::error title=#19::the suite crashed $attempts times in a row — that is not the usual 40%"
          exit 1

  macos:
    name: macos
    # The control: it is the machine the author already runs, so it earns nothing on a push. On a
    # tag and a pull request it is worth knowing whether a failure elsewhere is platform-specific
    # or simply a broken commit.
    if: github.event_name == 'pull_request' || github.ref_type == 'tag'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv run --extra dev --python 3.12 python -m pytest tests/ -q
