<title>TCC — main-screen prototype</title>
<style>
  :root {
    --ground: #0f1318; --panel: #161b22; --panel2: #1c232c; --panel3: #222b36;
    --border: #263040; --border2: #33404f;
    --text: #dfe6ee; --muted: #8b97a6; --faint: #5f6b7a;
    --accent: #e8973c; --accent-dim: #b3712c;
    --ok: #4bbf87; --inv: #e8973c; --off: #6a7686; --warn: #e05c5c; --info: #5aa9e6; --yellow: #e8c34a;
    --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --r: 7px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ground: #eef1f5; --panel: #ffffff; --panel2: #f4f6f9; --panel3: #e9edf2;
      --border: #d7dee6; --border2: #c4cdd8;
      --text: #1b2430; --muted: #5c6875; --faint: #93a0ad;
      --accent: #c56f18; --accent-dim: #a95f14;
      --ok: #1f9c63; --inv: #c56f18; --off: #8492a0; --warn: #c0392b; --info: #2f7fc4; --yellow: #c99a12;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0f1318; --panel: #161b22; --panel2: #1c232c; --panel3: #222b36;
    --border: #263040; --border2: #33404f;
    --text: #dfe6ee; --muted: #8b97a6; --faint: #5f6b7a;
    --accent: #e8973c; --accent-dim: #b3712c;
    --ok: #4bbf87; --inv: #e8973c; --off: #6a7686; --warn: #e05c5c; --info: #5aa9e6; --yellow: #e8c34a;
  }
  :root[data-theme="light"] {
    --ground: #eef1f5; --panel: #ffffff; --panel2: #f4f6f9; --panel3: #e9edf2;
    --border: #d7dee6; --border2: #c4cdd8;
    --text: #1b2430; --muted: #5c6875; --faint: #93a0ad;
    --accent: #c56f18; --accent-dim: #a95f14;
    --ok: #1f9c63; --inv: #c56f18; --off: #8492a0; --warn: #c0392b; --info: #2f7fc4; --yellow: #c99a12;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--ui); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; }

  .app { height: 100vh; display: grid; grid-template-rows: auto 1fr auto;
    grid-template-columns: minmax(230px, 265px) 1fr minmax(280px, 320px);
    grid-template-areas: "head head head" "left center right" "foot foot foot"; gap: 8px; padding: 8px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); }
  .head { grid-area: head; } .left { grid-area: left; overflow: hidden; display: flex; flex-direction: column; }
  .center { grid-area: center; overflow: hidden; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .right { grid-area: right; overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
  .foot { grid-area: foot; }

  /* header / footer as 3 zones so the feedback CTA sits centred */
  .head { padding: 8px 14px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; }
  .foot { padding: 7px 14px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; }
  .zone-l { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; min-width: 0; }
  .zone-r { display: flex; align-items: center; gap: 12px; justify-self: end; flex-wrap: wrap; }
  .kv { display: flex; align-items: baseline; gap: 8px; }
  .kv .lbl { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .kv .val { font-weight: 600; }
  .preset-select, .mini-select { appearance: none; background: var(--panel3); color: var(--text); border: 1px solid var(--border2); border-radius: 5px; padding: 4px 26px 4px 10px; font: inherit; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  .preset-select { font-weight: 600; }
  .mini-select { font-size: 12px; padding: 4px 24px 4px 9px; }
  .slot { font-family: var(--mono); color: var(--accent); font-weight: 600; }
  .savename { color: var(--muted); font-family: var(--mono); }
  .theme-btn { background: var(--panel3); border: 1px solid var(--border2); color: var(--muted); border-radius: 5px; padding: 5px 11px; cursor: pointer; font: inherit; font-size: 12px; }
  .theme-btn:hover { color: var(--text); }

  /* big bright feedback CTA (temporary, community) */
  .fb-cta { justify-self: center; background: var(--accent); color: #1a1206; border: none; border-radius: 22px; padding: 9px 22px; font: inherit; font-size: 14px; font-weight: 800; letter-spacing: .01em; cursor: pointer; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent), 0 3px 12px rgba(0,0,0,.35); animation: fbpulse 2.4s ease-in-out infinite; }
  .fb-cta:hover { filter: brightness(1.08); }
  @keyframes fbpulse { 0%,100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 26%, transparent), 0 3px 12px rgba(0,0,0,.35); } 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 12%, transparent), 0 3px 16px rgba(0,0,0,.4); } }
  @media (prefers-reduced-motion: reduce) { .fb-cta { animation: none; } }

  .phead { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; justify-content: space-between; flex: none; }
  .phead .sub { color: var(--faint); letter-spacing: .04em; text-transform: none; font-size: 11px; }

  .dsp-model { padding: 9px 12px; border-bottom: 1px solid var(--border); flex: none; }
  .dsp-model .rew { margin-top: 5px; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .dot.pending { background: var(--yellow); box-shadow: 0 0 0 3px color-mix(in srgb, var(--yellow) 22%, transparent); }
  .tree { overflow-y: auto; padding: 6px 4px 12px; flex: 1; }
  .row { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 5px; white-space: nowrap; }
  .row.click { cursor: pointer; } .row.click:hover { background: var(--panel2); }
  .tw { width: 12px; text-align: center; color: var(--faint); font-family: var(--mono); font-size: 10px; flex: none; user-select: none; }
  .grp > .row.ghead { text-transform: uppercase; letter-spacing: .1em; font-size: 10.5px; color: var(--muted); font-weight: 600; }
  .ghead .cnt { color: var(--faint); font-family: var(--mono); }
  .indent-2 { padding-left: 20px; }
  .paramrow { display: flex; padding: 3px 8px 3px 20px; font-size: 11px; }
  .paramrow .pk { color: var(--muted); } .paramrow .pv { margin-left: auto; font-family: var(--mono); }
  .prow-params { display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 20px; border-radius: 5px; cursor: pointer; color: var(--muted); font-size: 12px; }
  .prow-params:hover { background: var(--panel2); color: var(--accent); }
  .prow-params .ic { color: var(--accent); }
  .chan { padding: 4px 8px 5px 20px; border-radius: 5px; cursor: pointer; }
  .chan:hover { background: var(--panel2); }
  .chan.active { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .chan-dim { opacity: .5; }
  .cline1 { display: flex; align-items: center; gap: 6px; }
  .cline1 .cid { font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--accent); background: var(--panel3); border-radius: 3px; padding: 0 4px; flex: none; }
  .cline1 .cn { font-weight: 600; }
  .cline1 .ctag2 { font-size: 9px; letter-spacing: .03em; color: var(--info); background: color-mix(in srgb, var(--info) 15%, transparent); border-radius: 3px; padding: 0 5px; flex: none; }
  .cline1 .eq-chip { margin-left: auto; }
  .cline2 { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; padding: 1px 6px; border-radius: 20px; flex: none; }
  .pill.inv { color: var(--inv); background: color-mix(in srgb, var(--inv) 16%, transparent); }
  .pill.norm { color: var(--muted); background: var(--panel3); }
  .pill.off { color: var(--off); background: var(--panel3); }
  .eq-chip { font-size: 10px; font-family: var(--mono); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 4px; padding: 0 6px; cursor: pointer; flex: none; }
  .eq-chip:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .eq-chip.muted { color: var(--faint); border-color: var(--border2); cursor: default; }
  .collapsed > .children { display: none; }

  .detail { flex: none; max-height: 0; overflow: hidden; transition: max-height .2s ease; }
  .detail.open { max-height: 50%; }
  @media (prefers-reduced-motion: reduce) { .detail { transition: none; } }
  .detail .panel { max-height: 100%; display: flex; flex-direction: column; }
  .d-tabs { display: flex; gap: 6px; align-items: center; }
  .d-tab { font-size: 11px; color: var(--muted); border: 1px solid transparent; border-radius: 5px; padding: 2px 9px; cursor: pointer; text-transform: none; letter-spacing: 0; }
  .d-tab:hover { color: var(--text); }
  .d-tab.on { color: var(--accent); border-color: var(--accent-dim); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .d-close { background: none; border: 1px solid var(--border2); color: var(--muted); border-radius: 5px; cursor: pointer; padding: 2px 9px; font: inherit; font-size: 11px; }
  .d-close:hover { color: var(--text); }
  .d-body { padding: 0; overflow: auto; flex: 1; }

  .ptable { width: 100%; border-collapse: collapse; font-size: 12px; }
  .ptable th { text-align: right; font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 7px 12px; border-bottom: 1px solid var(--border2); position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .ptable th.l, .ptable td.l { text-align: left; }
  .ptable td { padding: 6px 12px; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .ptable tbody tr { cursor: pointer; }
  .ptable tbody tr:hover td { background: var(--panel2); }
  .ptable tr.sel td { background: color-mix(in srgb, var(--accent) 13%, transparent); }
  .ptable td.cid2 { font-family: var(--mono); color: var(--accent); font-weight: 600; }
  .ptable td.cname { font-family: var(--ui); font-weight: 600; }
  .ptable .ttag { color: var(--info); font-size: 10px; }
  .ptable .gpos { color: var(--ok); } .ptable .gneg { color: var(--accent); }
  .ptable .tinv { color: var(--inv); font-weight: 600; } .ptable .tnorm { color: var(--muted); }
  .ptable .eqcell { color: var(--accent); } .ptable .eqcell.muted { color: var(--faint); }
  .ptable .dim { color: var(--faint); }

  .eq-hint { color: var(--faint); font-size: 11px; margin: 10px 12px 8px; }
  .eq-hint b { color: var(--muted); font-weight: 600; }
  .eq-table { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; padding: 0 12px 14px; }
  .eq-rows { display: flex; flex-direction: column; gap: 12px; padding: 4px 12px 14px; }
  .eq-row .rowlab { font-size: 11px; font-weight: 600; color: var(--muted); margin: 0 0 6px; letter-spacing: .04em; }
  .eq-row .eq-table { padding: 0; flex-wrap: nowrap; overflow-x: auto; }
  .match-legend { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 10.5px; color: var(--muted); padding: 0 12px 4px; }
  .match-legend .ml { display: flex; align-items: center; gap: 4px; font-family: var(--mono); }
  .match-legend .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .band { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; width: 112px; overflow: hidden; }
  .band.bypassed { opacity: .45; }
  .band .bid { text-align: center; font-family: var(--mono); font-size: 11px; color: var(--accent); background: var(--panel3); padding: 3px 0; border-bottom: 1px solid var(--border); }
  .band .frow { display: flex; justify-content: space-between; padding: 3px 8px; font-size: 11px; border-bottom: 1px solid color-mix(in srgb, var(--border) 55%, transparent); }
  .band .frow .fk { color: var(--muted); }
  .band .frow .fv { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .band .frow .fv.type { color: var(--info); }
  .band .frow .fv.gain-pos { color: var(--ok); } .band .frow .fv.gain-neg { color: var(--accent); }
  .band .byp { text-align: center; font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 4px 0 7px; user-select: none; }
  .band .byp .b-o { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--faint); vertical-align: -2px; margin-right: 5px; }
  .band.bypassed .byp .b-o { background: var(--warn); border-color: var(--warn); }

  .dialog { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .dialog .body { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 82%; padding: 9px 12px; border-radius: 10px; }
  .msg .who { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .msg.gen { align-self: flex-start; background: var(--panel2); border: 1px solid var(--border); border-top-left-radius: 3px; }
  .msg.crit { align-self: flex-start; background: color-mix(in srgb, var(--info) 12%, var(--panel2)); border: 1px solid color-mix(in srgb, var(--info) 30%, var(--border)); border-top-left-radius: 3px; }
  .msg.crit .who { color: var(--info); }
  .msg.user { align-self: flex-end; background: color-mix(in srgb, var(--accent) 16%, var(--panel2)); border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border)); border-top-right-radius: 3px; }
  .msg.user .who { color: var(--accent); }
  .msg code { font-family: var(--mono); font-size: 12px; background: var(--panel3); padding: 1px 4px; border-radius: 3px; }
  .composer { flex: none; border-top: 1px solid var(--border); padding: 9px 12px; display: flex; gap: 8px; }
  .composer input { flex: 1; background: var(--panel2); border: 1px solid var(--border2); border-radius: 6px; color: var(--text); padding: 8px 11px; font: inherit; }
  .composer input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); border-color: var(--accent-dim); }
  .composer button { background: var(--accent); color: #1a1206; border: none; border-radius: 6px; padding: 0 16px; font: inherit; font-weight: 700; cursor: pointer; }
  .composer button:hover { filter: brightness(1.08); }

  .right .plan { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .plantree { overflow-y: auto; padding: 8px 10px 12px; flex: 1; }
  .phase { margin-bottom: 4px; }
  .phase > .prow { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 5px; }
  .phase > .prow.click { cursor: pointer; } .phase > .prow.click:hover { background: var(--panel2); }
  .phase.current > .prow { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .pcaret { width: 12px; text-align: center; color: var(--faint); font-family: var(--mono); font-size: 10px; flex: none; }
  .pcnt { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .phase.pcol .psteps { display: none; }
  .st { width: 15px; height: 15px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 10px; font-weight: 700; }
  .st.done { background: var(--ok); color: #04160d; } .st.cur { background: var(--accent); color: #1a1206; } .st.todo { background: var(--panel3); color: var(--faint); }
  .pname { font-weight: 600; } .phase.current > .prow .pname { color: var(--accent); }
  .substep { display: flex; align-items: center; gap: 8px; padding: 3px 6px 3px 26px; color: var(--muted); font-size: 12px; }
  .substep .stag { margin-left: auto; font-size: 10px; }
  .stag.ok { color: var(--ok); } .stag.wait { color: var(--yellow); }

  .meas { flex: none; max-height: 50%; display: flex; }
  .meas .panel { border-color: color-mix(in srgb, var(--yellow) 45%, var(--border)); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .meas .phead { color: color-mix(in srgb, var(--yellow) 70%, var(--text)); border-bottom-color: color-mix(in srgb, var(--yellow) 30%, var(--border)); flex: none; }
  .meas-body { padding: 10px 13px 13px; overflow-y: auto; }
  .meas-head { font-family: var(--mono); font-size: 13px; font-weight: 600; padding: 5px 9px; border-radius: 5px;
    color: color-mix(in srgb, var(--yellow) 82%, var(--text)); background: color-mix(in srgb, var(--yellow) 20%, transparent); border: 1px solid color-mix(in srgb, var(--yellow) 42%, transparent); }
  .meas-legend { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 10px; margin: 4px 0 10px; }
  .meas-legend .lg { display: flex; align-items: center; gap: 4px; }
  .tl { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .tl.wait { background: var(--yellow); } .tl.done { background: var(--ok); } .tl.bad { background: var(--warn); }
  .meas-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; }
  .mcol-h { font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 3px; margin-bottom: 5px; }
  .mrow { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; padding: 2px 0; }
  .mrow .mn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrow.bad .mn { color: var(--warn); } .mrow.wait .mn { color: var(--muted); }
  .mrow .mn-n { color: var(--faint); }

  .zone-r .ai, .zone-l .ai { display: flex; align-items: center; gap: 8px; }
  .ai .role { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .ai .last { font-size: 11px; color: var(--faint); }
  .foot .note { font-size: 11px; color: var(--faint); justify-self: end; text-align: right; } .foot .note b { color: var(--muted); }

  .fb-modal { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; padding: 20px; }
  .fb-modal.open { display: flex; }
  .fb-card { background: var(--panel); border: 1px solid var(--border2); border-radius: 12px; width: 100%; max-width: 460px; padding: 18px 20px 20px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .fb-head { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .fb-x { background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; }
  .fb-hint { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  .fb-toolbar { display: flex; gap: 4px; margin-bottom: 6px; }
  .fb-toolbar button { background: var(--panel3); border: 1px solid var(--border2); color: var(--text); border-radius: 6px; width: 30px; height: 28px; font: inherit; font-size: 13px; cursor: pointer; }
  .fb-toolbar button:hover { background: var(--panel2); border-color: var(--accent-dim); }
  .fb-toolbar button[data-cmd="italic"] { font-style: italic; }
  .fb-rte { width: 100%; min-height: 110px; max-height: 240px; overflow-y: auto; background: var(--panel2); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); padding: 10px 12px; font: inherit; }
  .fb-rte:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); border-color: var(--accent-dim); }
  .fb-rte:empty:before { content: attr(data-ph); color: var(--faint); }
  .fb-rte ul, .fb-rte ol { margin: 4px 0; padding-left: 22px; }
  .fb-check { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin-top: 12px; cursor: pointer; }
  .fb-check input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  .fb-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
  .fb-cancel { background: var(--panel3); border: 1px solid var(--border2); color: var(--muted); border-radius: 7px; padding: 8px 14px; font: inherit; cursor: pointer; }
  .fb-send { background: var(--accent); color: #1a1206; border: none; border-radius: 7px; padding: 8px 16px; font: inherit; font-weight: 700; cursor: pointer; }
  .fb-send:hover { filter: brightness(1.08); }
</style>

<div class="app">
  <header class="panel head">
    <div class="zone-l">
      <div class="kv"><span class="lbl" id="lbPreset">Preset</span>
        <select class="preset-select" id="presetSel"></select>
        <span class="slot" id="slot"></span><span class="savename" id="savename"></span>
      </div>
      <div class="kv"><span class="lbl" id="lbTarget">Target curve</span><span class="val" id="target"></span></div>
    </div>

const legLabel = l => (l===OFF||!l) ? "OFF" : `${fmt(l.f)} ${l.t}${l.s}`;
const fmt = n => (Math.round(n*100)/100).toString();
const gsign = g => (g>=0?"+":"")+g.toFixed(1);

function renderTree(){
  const p = PRESETS[cur];
  const root = document.getElementById("tree"); root.innerHTML = "";
  const paramKids = (p.features||[]).map(([k,v])=>infoRow(k, tx(v)));
  if(paramKids.length) root.appendChild(groupNode(t("params"), "", true, paramKids));
  root.appendChild(groupNode(t("virtual"), `${p.virtual.filter(x=>!x.na).length}/${DSP.virtualMax}`, false,
    [paramsRow("virtual")].concat(p.virtual.map((v,i)=> v.na?null:chanRow(v,"virtual",i,false)).filter(Boolean))));
  root.appendChild(groupNode(t("output"), `${p.output.filter(x=>!x.na).length}/${DSP.outputMax}`, false,
    [paramsRow("output")].concat(p.output.map((c,i)=> c.na?null:chanRow(c,"output",i,true)).filter(Boolean))));
}
function groupNode(label, count, collapsed, children){
  const node = el("div","node grp"+(collapsed?" collapsed":""));
  const row = el("div","row click ghead");
  const tw = el("span","tw", collapsed?"▸":"▾");
  row.appendChild(tw);
  row.appendChild(el("span",null, label + (count!==""?` <span class="cnt">${count}</span>`:"")));
  const kids = el("div","children"); children.forEach(c=>kids.appendChild(c));
  row.addEventListener("click",()=>{ node.classList.toggle("collapsed"); tw.textContent = node.classList.contains("collapsed")?"▸":"▾"; });
  node.appendChild(row); node.appendChild(kids); return node;
}
function infoRow(k,v){ return el("div","paramrow", `<span class="pk">${k}</span><span class="pv">${v}</span>`); }
function paramsRow(tier){
  const r = el("div","prow-params", `<span class="ic">⊞</span> ${t("paramsRow")}`);
  r.addEventListener("click",()=> openTable(tier)); return r;
}
function chanRow(c, tier, idx, isOutput){
  const wrap = el("div","chan"); wrap.dataset.tier=tier; wrap.dataset.idx=idx;
  const dis = c.off||c.mute; const n=(c.eq||[]).length;
  if(dis) wrap.classList.add("chan-dim");
  const l1 = el("div","cline1");
  l1.appendChild(el("span","cid", c.id));
  l1.appendChild(el("span","cn", abbrOf(c,isOutput)));
  if(dis) l1.appendChild(el("span","pill off", c.mute?"MUTE":"OFF"));
  else l1.appendChild(el("span","pill "+(c.pol==="INV"?"inv":"norm"), c.pol));
  if(!isOutput && c.tag) l1.appendChild(el("span","ctag2", c.tag));
  if(n>0){ const chip=el("span","eq-chip",`EQ ${n}`); chip.addEventListener("click",e=>{e.stopPropagation();openEq(tier,idx);}); l1.appendChild(chip); }
  else l1.appendChild(el("span","eq-chip muted","EQ —"));
  wrap.appendChild(l1);
  if(isOutput){ const l2=el("div","cline2"); l2.textContent=`HP ${legLabel(c.hp)} · LP ${legLabel(c.lp)} · ${gsign(c.gain)}dB`; wrap.appendChild(l2); }
  wrap.title = isOutput
    ? `${c.id} · ${c.name}\nHPF ${legLabel(c.hp)} · LPF ${legLabel(c.lp)}\nGain ${gsign(c.gain)} dB · Delay ${fmt(c.delay)} ms · Ph ${c.pol}\nEQ ${n}`
    : `${c.id} · ${c.name}${c.tag?` [${c.tag}]`:""}\nGain ${gsign(c.gain)} dB · Delay ${fmt(c.delay)} ms · Ph ${c.pol}${c.mute?" · MUTE":""}\nEQ ${n}`;
  wrap.addEventListener("click",()=>{ openTable(tier); selectChan(tier,idx); });
  return wrap;
}

function openTable(tier){
  mode="table"; tableTier=tier;
  const p = PRESETS[cur]; const list = tier==="virtual"?p.virtual:p.output; const isOut = tier==="output";
  document.getElementById("detailTitle").textContent = (isOut?t("outTitle"):t("virtTitle"))+` · ${list.filter(x=>!x.na).length}/${isOut?DSP.outputMax:DSP.virtualMax}`;
  const cols = isOut ? [t("colId"),t("colChan"),"HPF","LPF",t("colGain"),t("colDelay"),t("colPol"),t("colEQ")]
                     : [t("colId"),t("colChan"),t("colGain"),t("colDelay"),t("colPol"),t("colMute"),t("colEQ")];
  let h = `<table class="ptable"><thead><tr>`;
  cols.forEach((c,i)=> h += `<th class="${i<2?'l':''}">${c}</th>`);
  h += `</tr></thead><tbody>`;
  list.forEach((c,idx)=>{
    if(c.na) return;
    const dis = c.off||c.mute; const gc = c.gain>=0?"gpos":"gneg";
    const pol = `<span class="${c.pol==='INV'?'tinv':'tnorm'}">${c.pol}</span>`;
    const eqn = (c.eq||[]).length;
    const eq = eqn>0 ? `<span class="eqcell">${eqn} ${t("bandsCell")}</span>` : `<span class="eqcell muted">—</span>`;
    const nameCell = `<td class="l cid2">${c.id}</td><td class="l cname" title="${c.name}">${abbrOf(c,isOut)}${(!isOut&&c.tag)?` <span class="ttag">[${c.tag}]</span>`:''}</td>`;
    if(isOut){
      h += `<tr data-idx="${idx}" ${dis?'class="rdis"':''}>${nameCell}
        <td class="${c.hp===OFF?'dim':''}">${legLabel(c.hp)}</td>
        <td class="${c.lp===OFF?'dim':''}">${legLabel(c.lp)}</td>
        <td class="${dis?'dim':gc}">${gsign(c.gain)}</td>
        <td>${fmt(c.delay)}</td><td>${pol}</td>
        <td class="eqc">${eq}</td></tr>`;
    } else {
      h += `<tr data-idx="${idx}" ${dis?'class="rdis"':''}>${nameCell}
        <td class="${dis?'dim':gc}">${gsign(c.gain)}</td>
        <td>${fmt(c.delay)}</td><td>${pol}</td>
        <td class="${c.mute?'':'dim'}">${c.mute?'MUTE':'—'}</td>

}
function selectChan(tier, idx){

function siblingName(n){ if(n.includes(" L ")) return n.replace(" L "," R "); if(n.includes(" R ")) return n.replace(" R "," L "); return null; }
const isLeft = n => n.includes(" L ");
function bandHtml(cidx, band, mc){
  const noGain = band.gain==null; const gc = noGain ? "" : (band.gain>=0?"gain-pos":"gain-neg"); const gv = noGain ? "—" : gsign(band.gain)+" dB";
  const mstyle = mc ? ` style="border-top:3px solid ${mc}"` : "";
  return `<div class="band${band.bypass?' bypassed':''}"${mstyle} data-cidx="${cidx}" data-id="${band.id}">
    <div class="bid">${t("band")} ${band.id}</div>
    <div class="frow"><span class="fk">Type</span><span class="fv type">${band.type}</span></div>
    <div class="frow"><span class="fk">Freq</span><span class="fv">${band.freq} Hz</span></div>
    <div class="frow"><span class="fk">Q</span><span class="fv">${band.q.toFixed(2)}</span></div>
    <div class="frow"><span class="fk">Gain</span><span class="fv ${gc}">${gv}</span></div>
    <div class="byp"><span class="b-o"></span>${band.bypass?'BYPASS':t("active")}</div></div>`;
}
const bandsFlex = (cidx, chan, cmap) => `<div class="eq-table">`+chan.eq.map(bd=>bandHtml(cidx,bd, cmap?cmap[bd.freq]:null)).join("")+`</div>`;
const MATCH_PALETTE = ["#5aa9e6","#4bbf87","#e8973c","#c98fe0","#e8c34a","#e05c5c"];
function openEq(tier, idx){
  mode="eq"; selChan={tier, idx};
  const list = tier==="virtual"?PRESETS[cur].virtual:PRESETS[cur].output; const c = list[idx];
  const sibN = siblingName(c.name); const sibIdx = sibN ? list.findIndex(x=>x.name===sibN) : -1; const hasSib = sibIdx>=0;
  const pairBtn = document.getElementById("pairBtn");
  pairBtn.style.display = hasSib ? "" : "none"; pairBtn.classList.toggle("on", pairMode && hasSib);
  const pair = pairMode && hasSib;
  const hint = `<p class="eq-hint">${t("eqHint")}</p>`;
  let title, bodyH;
  if(pair){
    let li=idx, ri=sibIdx; if(!isLeft(c.name)){ li=sibIdx; ri=idx; }
    const L=list[li], R=list[ri];
    const rf = new Set(R.eq.map(x=>x.freq));
    const shared = [...new Set(L.eq.map(x=>x.freq).filter(f=>rf.has(f)))];
    const cmap = {}; shared.forEach((f,i)=> cmap[f]=MATCH_PALETTE[i%MATCH_PALETTE.length]);
    const legend = shared.length
      ? `<div class="match-legend">${t("shared")} ${shared.map(f=>`<span class="ml"><span class="sw" style="background:${cmap[f]}"></span>${f}</span>`).join("")}</div>`
      : `<div class="match-legend">${t("noShared")}</div>`;
    const isOut = tier==="output", aL=abbrOf(L,isOut), aR=abbrOf(R,isOut);
    title = `EQ · ${aL} + ${aR}`;
    bodyH = hint + legend + `<div class="eq-rows">
      <div class="eq-row"><div class="rowlab" title="${L.name}">L · ${aL} <span style="color:var(--faint)">(${L.eq.length})</span></div>${bandsFlex(li,L,cmap)}</div>
      <div class="eq-row"><div class="rowlab" title="${R.name}">R · ${aR} <span style="color:var(--faint)">(${R.eq.length})</span></div>${bandsFlex(ri,R,cmap)}</div></div>`;
  } else {
    title = `EQ · ${c.id} · ${abbrOf(c, tier==="output")}`;
    bodyH = hint + bandsFlex(idx, c);
  }
  document.getElementById("detailTitle").textContent = title;
  document.getElementById("detailBody").innerHTML = bodyH;
  openDetail(); syncTabs();
  document.querySelectorAll(".tree .chan").forEach(r=> r.classList.toggle("active", r.dataset.tier===tier && +r.dataset.idx===idx));
}

// Non-GitHub destination: a public Google Form (no login required), pointing
// at the same "Your feedback" question via its entry ID for prefill.
const GFORM_ID = "1FAIpQLSdMzITv6Rzh8PWITy5QWc3xQMcAn9aDl1k0QbpZykHEQd6A4g";
const GFORM_ENTRY = "970390217";

function htmlToMarkdown(root){
  function inline(node){
    let out = "";
    node.childNodes.forEach(n=>{
      if(n.nodeType===Node.TEXT_NODE){ out += n.textContent; return; }
      const tag = n.tagName;
      if(tag==="B"||tag==="STRONG") out += `**${inline(n)}**`;
      else if(tag==="I"||tag==="EM") out += `_${inline(n)}_`;
      else if(tag==="BR") out += "\n";
      else out += inline(n);
    });
    return out;
  }
  let lines = [];
  function block(node){
    node.childNodes.forEach(n=>{
      if(n.nodeType===Node.TEXT_NODE){ const s=n.textContent; if(s.trim()) lines.push(s); return; }
      const tag = n.tagName;
      if(tag==="UL"){ n.querySelectorAll(":scope > li").forEach(li=> lines.push("- "+inline(li).trim())); }
      else if(tag==="OL"){ [...n.querySelectorAll(":scope > li")].forEach((li,i)=> lines.push(`${i+1}. `+inline(li).trim())); }
      else if(tag==="DIV"||tag==="P"){ const s=inline(n).trim(); if(s) lines.push(s); else lines.push(""); }
      else if(tag==="BR"){ lines.push(""); }
      else { const s=inline(n).trim(); if(s) lines.push(s); }
    });
  }
  block(root);
  return lines.join("\n").replace(/\n{3,}/g,"\n\n").trim();
}

  const REPO = "ayukhno/autosound-tcc";
  const modal = document.getElementById("fbModal"), rte = document.getElementById("fbRte"), gh = document.getElementById("fbGithub");
  const open = ()=>{ modal.classList.add("open"); rte.focus(); };
  const close = ()=> modal.classList.remove("open");
  document.querySelectorAll("[data-fb]").forEach(b=> b.addEventListener("click", open));
  document.getElementById("fbX").addEventListener("click", close);
  document.getElementById("fbCancel").addEventListener("click", close);
  modal.addEventListener("click", e=>{ if(e.target===modal) close(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") close(); });

  // toolbar: preventDefault on mousedown keeps the RTE selection alive
  document.querySelectorAll(".fb-toolbar button").forEach(btn=>{
    btn.addEventListener("mousedown", e=>{ e.preventDefault(); rte.focus(); document.execCommand(btn.dataset.cmd, false, null); });
  });

  document.getElementById("fbSend").addEventListener("click", ()=>{
    const md = htmlToMarkdown(rte) || "(feedback)";
    if(gh.checked){
      const body = encodeURIComponent(md + "\n\n---\nSource: TCC main-screen prototype · lang="+lang);
      const title = encodeURIComponent("TCC prototype — feedback");

      window.open(url, "_blank", "noopener");
      close(); rte.innerHTML = "";
    }
  });
})();
